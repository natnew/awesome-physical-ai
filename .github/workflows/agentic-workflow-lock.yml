name: agentic-workflow-lock

# gh-aw runs the compiled .lock.yml, not the .md source. Its activation step
# compares the frontmatter hash recorded in the lock file with the .md and
# fails every run ("Lock file ... is outdated") when they drift. That check
# only fires after merge, so this job recompiles the workflows on the pull
# request and fails if the committed lock files would change.

on:
  pull_request:
    paths:
      - .github/workflows/*.md
      - .github/workflows/*.lock.yml
      - .github/aw/**
      - .github/workflows/agentic-workflow-lock.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/*.md
      - .github/workflows/*.lock.yml
      - .github/aw/**
      - .github/workflows/agentic-workflow-lock.yml

permissions:
  contents: read

concurrency:
  group: agentic-workflow-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify gh-aw lock files match their sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the gh-aw version recorded in the lock files
        shell: bash
        run: |
          # Compile with the same compiler version that produced the committed
          # lock files so that this check reports source/lock drift only, not
          # output changes introduced by a gh-aw upgrade.
          versions="$(grep -ohE 'generated by gh-aw \(v[0-9]+\.[0-9]+\.[0-9]+\)' .github/workflows/*.lock.yml \
            | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -u)"
          count="$(printf '%s\n' "$versions" | grep -c . || true)"
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one gh-aw compiler version across .github/workflows/*.lock.yml, found: ${versions:-none}. Recompile every lock file with one gh-aw version."
            exit 1
          fi
          echo "Using gh-aw $versions"
          gh extension install github/gh-aw --pin "$versions"

      - name: Recompile agentic workflows
        run: gh aw compile --no-check-update

      - name: Fail if generated files are stale
        shell: bash
        run: |
          # Covers modified and untracked lock files plus the action-pin cache
          # that makes the compile reproducible.
          changes="$(git status --porcelain -- '.github/workflows/*.lock.yml' .github/aw)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            git --no-pager diff -- '.github/workflows/*.lock.yml' .github/aw
            echo "::error::gh-aw generated files are out of date with their .md sources. Run 'gh aw compile' locally and commit the regenerated .lock.yml and .github/aw/actions-lock.json."
            exit 1
          fi
          echo "All gh-aw lock files match their sources."
